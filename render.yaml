# Render Blueprint: describes the whole deployment in one file.
# In Render: New + -> Blueprint -> pick this repository. Render reads this file and creates:
#   1. a free PostgreSQL database
#   2. one free web service that runs the API server AND the email worker (npm run start:all)
#
# Free plans have no background workers, so both run in one process (they still only talk
# through the email_jobs table). On a paid plan you can split them: see docs/DEPLOYMENT.md.
# Values marked "sync: false" are secrets: Render asks you for them when you create the Blueprint.

databases:
  - name: quickquote-db
    plan: free
    databaseName: quickquote
    user: quickquote

services:
  - type: web
    name: quickquote-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: TypeScript is a dev dependency but is needed to build.
    buildCommand: npm ci --include=dev && npm run build
    # On every start: apply new migrations, make sure the seed data exists, then start
    # the API + email worker. "exec" lets the app receive Render's shutdown signal directly.
    startCommand: npm run migrate:deploy && npm run seed:deploy && exec node dist/src/all.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quickquote-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_DRIVER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Quick Quote <onboarding@resend.dev>"
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
