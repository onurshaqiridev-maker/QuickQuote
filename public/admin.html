<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Asks search engines not to list this private page -->
  <meta name="robots" content="noindex">
  <title>Admin | QuickQuote</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/admin.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">QuickQuote</a>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="/">Back to the website</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="admin-main">
    <div class="container">
      <h1>Quote requests</h1>
      <p class="admin-intro">Only for Sparkle Home Cleaning staff. Enter the admin password to see the requests customers have sent.</p>

      <!-- Step 1: the password -->
      <form id="login-form" class="login-form" novalidate>
        <label for="admin-password">Admin password</label>
        <div class="login-row">
          <input type="password" id="admin-password" name="password" autocomplete="current-password" required>
          <button type="submit" id="login-button" class="button">Show requests</button>
        </div>
        <!-- "Access denied" or other messages appear here -->
        <p id="admin-message" class="admin-message" role="alert" hidden></p>
      </form>

      <!-- Step 2: the table (filled in by admin.js after the right password) -->
      <section id="requests-section" hidden>
        <p id="requests-count" class="requests-count"></p>
        <!-- The wrapper lets the table scroll sideways on phones instead of breaking the page -->
        <div class="table-wrapper">
          <table class="requests-table">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Date</th>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Service</th>
                <th scope="col">Rooms</th>
                <th scope="col">How often</th>
                <th scope="col">Extras</th>
                <th scope="col">Total</th>
              </tr>
            </thead>
            <tbody id="requests-body">
              <!-- rows added by admin.js -->
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 QuickQuote · A student project</p>
    </div>
  </footer>

</body>
</html>
