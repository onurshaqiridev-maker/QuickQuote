# Local development database.
# Start it with:  docker compose up -d
# Stop it with:   docker compose down        (your data is kept in the "pgdata" volume)
services:
  postgres:
    image: postgres:16
    container_name: quickquote-postgres
    environment:
      POSTGRES_USER: quickquote
      POSTGRES_PASSWORD: quickquote
      POSTGRES_DB: quickquote
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickquote -d quickquote"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
